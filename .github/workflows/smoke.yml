# Install the released artifact on Linux and Windows and drive the real app.
#
# Every other check in this repo runs on a developer's macOS machine or in
# jsdom. Neither sees a WebKitGTK or a WebView2 window. The failures this
# catches — a shared library the .deb does not pull in, a WebView2 that never
# initialises, a keychain with no daemon behind it — are invisible to 1,954
# unit tests and to the person who built the release.
#
# It installs the artifact rather than building from source on purpose. A
# `cargo build` on the runner would test the source; installing the .deb and
# the .msi tests what a user actually downloads, packaging included.

name: Smoke

on:
  # The normal path: a release was published, so check what it published.
  release:
    types: [published]
  # And on demand, so a suspect release can be re-checked without cutting a new
  # one, and so this workflow can be developed without publishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and drive (e.g. v0.1.0-beta.9)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure should not hide a Linux one, or the reverse.
      fail-fast: false
      matrix:
        include:
          # Match the runner the release is built on. Building on 22.04 sets a
          # glibc 2.34 floor; testing on a newer image would silently pass on a
          # binary that no 22.04 user can start.
          - os: ubuntu-22.04
            name: Ubuntu 22.04 (x86_64)
          - os: windows-latest
            name: Windows (x86_64)

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2025-07

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # `webkit2gtk-driver` is the WebDriver implementation tauri-driver proxies
      # to on Linux; `xvfb` is the fake display that lets a GUI app run on a
      # headless runner without changing a line of the app.
      - name: WebDriver and display dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb gnome-keyring dbus-x11

      # A Tauri app on Windows runs in the WebView2 Runtime, which is a
      # different product from the Edge browser and carries its own version.
      # `msedgedriver` must match the WebView2 Runtime, not the browser — and
      # a mismatch does not say so, it reports `session not created:
      # DevToolsActivePort file doesn't exist`, which reads like the app
      # crashed.
      #
      # This is why matching against Edge did not work: the runner has no Edge
      # browser installed at all, so nothing was detected and the preinstalled
      # driver at C:\SeleniumWebDrivers\EdgeDriver was used against whatever
      # WebView2 the MSI brought in.
      #
      # `pv` under the Evergreen WebView2 Runtime's own EdgeUpdate key is the
      # authoritative version. Fail loudly if it is missing rather than
      # falling back to a driver that will not match.
      - name: msedgedriver matching the WebView2 Runtime (Windows)
        if: runner.os == 'Windows'
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $key -Name pv -ErrorAction Stop).pv
          Write-Host "WebView2 Runtime: $pv"
          $dir = "$env:RUNNER_TEMP\edgedriver"
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dir -Force
          & "$dir\msedgedriver.exe" --version
          # GITHUB_PATH prepends, so this wins over the runner's preinstalled
          # driver rather than merely sitting behind it.
          $dir >> $env:GITHUB_PATH

      # A real server, so the connect spec exercises the driver rather than a
      # mock. Same action on both platforms: Windows runners cannot use service
      # containers, so a service container on Linux would mean two code paths.
      - name: PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v8
        id: postgres

      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -D artifacts -p 'TupleNest_*_amd64.deb' -p 'TupleNest_*_x64_en-US.msi'
        shell: bash

      - name: Install the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./artifacts/TupleNest_*_amd64.deb
          # Prove the installed binary resolves every library it links before
          # blaming the test framework for a session that will not start.
          ldd /usr/bin/tuplenest-desktop | grep -i "not found" && exit 1
          echo "TUPLENEST_BIN=/usr/bin/tuplenest-desktop" >> "$GITHUB_ENV"

      - name: Install the .msi (Windows)
        if: runner.os == 'Windows'
        run: |
          $msi = (Get-ChildItem artifacts\*.msi)[0].FullName
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /quiet /norestart /l*v install.log"
          $exe = "C:\Program Files\TupleNest\tuplenest-desktop.exe"
          if (!(Test-Path $exe)) { Get-Content install.log -Tail 40; throw "MSI did not install $exe" }
          "TUPLENEST_BIN=$exe" >> $env:GITHUB_ENV

      # `ci`, not `install`: the lockfile is committed, and this suite is one
      # `npm install` away from silently resolving a different tree than the
      # one that was verified. It already happened once — a service version
      # that imports a symbol its own pinned dependency does not export.
      - name: Install test dependencies
        run: npm ci
        working-directory: e2e

      # Windows has a real Credential Manager, so the app's keychain path works
      # as-is. Linux does not: the Secret Service is a daemon, and a bare runner
      # has nothing owning `org.freedesktop.secrets`. Rather than skip the
      # password path on the one platform where it genuinely fails for users,
      # stand a keyring up — the same approach ci.yml already takes for the
      # credential-store contract test.
      - name: Smoke (Linux, under xvfb with an unlocked keyring)
        if: runner.os == 'Linux'
        working-directory: e2e
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ${{ steps.postgres.outputs.user }}
          PGPASSWORD: ${{ steps.postgres.outputs.password }}
          PGDATABASE: ${{ steps.postgres.outputs.database }}
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            # --daemonize so it forks and returns, and eval because the daemon
            # prints the environment it needs exported. The unlock password must
            # be non-empty: an empty one does not create the login keyring, so
            # the daemon owns the bus name but has no collection to store into.
            eval "$(echo -n smoke | gnome-keyring-daemon --unlock --daemonize --components=secrets)"
            xvfb-run --auto-servernum npm test
          '

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        working-directory: e2e
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ${{ steps.postgres.outputs.user }}
          PGPASSWORD: ${{ steps.postgres.outputs.password }}
          PGDATABASE: ${{ steps.postgres.outputs.database }}
        run: npm test

      # A driver/browser version mismatch reports itself as if the app crashed,
      # so record both numbers rather than leaving the next person to guess.
      - name: Edge and driver versions on failure (Windows)
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        run: |
          (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          Get-Command msedgedriver.exe -All -ErrorAction SilentlyContinue | ForEach-Object { $_.Source; & $_.Source --version }

      # The app's own log is far more useful than the WebDriver transcript when
      # the window opened and then something inside it went wrong.
      - name: App log on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          find "$HOME/.local/share/TupleNest" "$HOME/.config/TupleNest" \
               "$LOCALAPPDATA/TupleNest" -name '*.log' -print -exec tail -n 200 {} \; 2>/dev/null || true
