# Install the released artifact on Linux and Windows and run the real app.
#
# Every other check in this repo runs on a developer's macOS machine or in
# jsdom. Neither sees a WebKitGTK or a WebView2 window. The failures this
# catches — a shared library the .deb does not pull in, a WebView2 that never
# initialises, a keychain with no daemon behind it — are invisible to 1,954
# unit tests and to the person who built the release.
#
# It installs the artifact rather than building from source on purpose. A
# `cargo build` on the runner would test the source; installing the .deb and
# the .msi tests what a user actually downloads, packaging included.
#
# The two platforms go to different depths, and the difference is real rather
# than incidental:
#
#   Linux   — full WebDriver run against the installed .deb: shell, editor,
#             plan analyzer, then connect, query, history and catalog against
#             a live PostgreSQL.
#   Windows — installs the .msi, launches the binary, and asserts a window
#             opens. `tauri-driver` cannot drive a release build here, because
#             it needs the WebView2 remote-debugging port that Tauri only
#             enables via the `devtools` feature (on in debug, off in
#             release). Driving a debug build would test a binary nobody
#             ships; enabling devtools in release to satisfy a test would be
#             worse. The step where this is done explains it in full.

name: Smoke

on:
  # The normal path: a release was published, so check what it published.
  release:
    types: [published]
  # And on demand, so a suspect release can be re-checked without cutting a new
  # one, and so this workflow can be developed without publishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and drive (e.g. v0.1.0-beta.9)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure should not hide a Linux one, or the reverse.
      fail-fast: false
      matrix:
        include:
          # Match the runner the release is built on. Building on 22.04 sets a
          # glibc 2.34 floor; testing on a newer image would silently pass on a
          # binary that no 22.04 user can start.
          - os: ubuntu-22.04
            name: Ubuntu 22.04 (x86_64)
          - os: windows-latest
            name: Windows (x86_64)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'Linux'
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2025-07
        if: runner.os == 'Linux'

      - name: Install tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      # `webkit2gtk-driver` is the WebDriver implementation tauri-driver proxies
      # to on Linux; `xvfb` is the fake display that lets a GUI app run on a
      # headless runner without changing a line of the app.
      - name: WebDriver and display dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb gnome-keyring dbus-x11

      # A real server, so the connect spec exercises the driver rather than a
      # mock. Linux only — it is the only leg that runs the specs, and this
      # action takes roughly twenty minutes on a Windows runner.
      - name: PostgreSQL
        if: runner.os == 'Linux'
        uses: ikalnytskyi/action-setup-postgres@10ab8a56cc77b4823c2bfa57b1d4dd5605ef0481 # v8
        id: postgres

      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -D artifacts -p 'TupleNest_*_amd64.deb' -p 'TupleNest_*_x64_en-US.msi'
        shell: bash

      - name: Install the .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./artifacts/TupleNest_*_amd64.deb
          # Prove the installed binary resolves every library it links before
          # blaming the test framework for a session that will not start.
          ldd /usr/bin/tuplenest-desktop | grep -i "not found" && exit 1
          echo "TUPLENEST_BIN=/usr/bin/tuplenest-desktop" >> "$GITHUB_ENV"

      - name: Install the .msi (Windows)
        if: runner.os == 'Windows'
        run: |
          $msi = (Get-ChildItem artifacts\*.msi)[0].FullName
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /quiet /norestart /l*v install.log"
          $exe = "C:\Program Files\TupleNest\tuplenest-desktop.exe"
          if (!(Test-Path $exe)) { Get-Content install.log -Tail 40; throw "MSI did not install $exe" }
          "TUPLENEST_BIN=$exe" >> $env:GITHUB_ENV

      # Windows is checked by launching the installed app and confirming it
      # opens a real window. It does not run the WebDriver specs, and that is
      # a property of the artifact rather than a gap someone forgot to close.
      #
      # `tauri-driver` drives a Windows app through msedgedriver, which needs
      # the WebView2 remote-debugging port. Tauri enables that with the
      # `devtools` feature, which is on automatically in debug builds and off
      # in release. This app is `tauri = { features = [] }`, so the shipped
      # binary has no debugging port and msedgedriver has nothing to attach
      # to — it reports `session not created: DevToolsActivePort file doesn't
      # exist`, which reads like a crash and is not one. Tauri's own CI
      # example sidesteps this by building with `--debug`.
      #
      # Driving a debug build here would mean testing a binary nobody ships.
      # Shipping a devtools-enabled release build to make a test pass would be
      # worse. So Windows proves what it honestly can: the MSI installs, the
      # binary runs, and a window appears — which is exactly the class of
      # failure (missing runtime, WebView2 that never initialises, blank
      # window) this suite was built to catch.
      - name: The installed app opens a window (Windows)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process -FilePath $env:TUPLENEST_BIN -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Host "::error::TupleNest exited with code $($p.ExitCode) instead of staying up"
            Get-ChildItem -Recurse "$env:APPDATA\app.tuplenest.desktop" -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 100 }
            exit 1
          }
          # A live process is not enough: a WebView2 that fails to initialise
          # leaves the process up with no window, which is the exact failure
          # worth catching.
          $p.Refresh()
          if ($p.MainWindowHandle -eq 0) {
            Write-Host "::error::process is alive but opened no window — WebView2 likely failed to initialise"
            Stop-Process -Id $p.Id -Force
            exit 1
          }
          Write-Host "Window open after 25s: '$($p.MainWindowTitle)' (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      # `ci`, not `install`: the lockfile is committed, and this suite is one
      # `npm install` away from silently resolving a different tree than the
      # one that was verified. It already happened once — a service version
      # that imports a symbol its own pinned dependency does not export.
      - name: Install test dependencies
        if: runner.os == 'Linux'
        run: npm ci
        working-directory: e2e

      # Windows has a real Credential Manager, so the app's keychain path works
      # as-is. Linux does not: the Secret Service is a daemon, and a bare runner
      # has nothing owning `org.freedesktop.secrets`. Rather than skip the
      # password path on the one platform where it genuinely fails for users,
      # stand a keyring up — the same approach ci.yml already takes for the
      # credential-store contract test.
      - name: Smoke (Linux, under xvfb with an unlocked keyring)
        if: runner.os == 'Linux'
        working-directory: e2e
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ${{ steps.postgres.outputs.user }}
          PGPASSWORD: ${{ steps.postgres.outputs.password }}
          PGDATABASE: ${{ steps.postgres.outputs.database }}
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            # --daemonize so it forks and returns, and eval because the daemon
            # prints the environment it needs exported. The unlock password must
            # be non-empty: an empty one does not create the login keyring, so
            # the daemon owns the bus name but has no collection to store into.
            eval "$(echo -n smoke | gnome-keyring-daemon --unlock --daemonize --components=secrets)"
            xvfb-run --auto-servernum npm test
          '

      # The app's own log is far more useful than the WebDriver transcript when
      # the window opened and then something inside it went wrong.
      - name: App log on failure
        if: failure()
        continue-on-error: true
        shell: bash
        # The directory is the bundle identifier, not the product name — an
        # earlier version of this looked under `TupleNest` and would have found
        # nothing even when there was something to find.
        run: |
          find "$HOME/.local/share/app.tuplenest.desktop" \
               "$HOME/.config/app.tuplenest.desktop" \
               "$APPDATA/app.tuplenest.desktop" \
               -name '*.log' -print -exec tail -n 200 {} \; 2>/dev/null || true
