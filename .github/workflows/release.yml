name: Release

# Cross-compiling a Tauri app is not practical: Windows needs MSVC and WebView2,
# Linux needs webkit2gtk, macOS needs the Apple toolchain. Each platform builds
# on its own runner. That is why this exists as a matrix rather than a script
# someone runs on a laptop.
#
# Triggered by a version tag, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x86_64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x86_64)

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    # The signing key is reachable from this job. Holding it in the `release`
    # environment lets the repo require an approval (Settings → Environments →
    # release → Required reviewers) before any run — a dispatch from any
    # branch included — can see it. See docs/releasing.md.
    environment: release

    # The `secrets` context cannot be read from a step-level `if:`, so the
    # "does this secret exist" question is answered once here and the steps
    # branch on the answer. Comparing to '' is the only way to distinguish an
    # absent secret from a present one — its value is never exposed.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The updater compares the app version, not the tag. Eleven betas shipped
      # as 0.1.0 because nothing checked that the two agree; now the build does.
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"; want="${want%%-*}"   # v0.1.2-beta.13 -> 0.1.2
          conf=$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          pkg=$(grep -m1 '"version"' apps/desktop/package.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]*)".*/\1/')
          for v in "$conf" "$pkg" "$cargo"; do
            if [ "$v" != "$want" ]; then
              echo "::error::tag $TAG wants app version $want, but tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
              exit 1
            fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2025-07
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: ${{ matrix.target }}

      # Built on 22.04 rather than latest: the glibc a distro ships is the
      # oldest one the binary will run on, so building on the newest Ubuntu
      # would quietly drop support for every older machine.
      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev libayatana-appindicator3-dev \
            build-essential curl wget file libssl-dev patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Sign a throwaway file before spending twelve minutes compiling.
      #
      # `bundle.createUpdaterArtifacts` is on, so the very last thing a release
      # build does is sign — which means a wrong signing password wastes the
      # entire build on every platform and then reports
      # "failed to decode secret key: incorrect updater private key password"
      # under a log full of successful bundles. That is exactly how the first
      # v0.1.0-beta.1 attempt failed: deb, rpm and AppImage all built, then the
      # signature killed it.
      #
      # Twenty seconds here turns that into a named failure before any
      # compilation. The probe file must exist: `signer sign` checks the
      # password first and the file second, so a missing file fails for the
      # wrong reason and would read as a pass.
      - name: Preflight — the updater key and its password must actually work
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — the build would produce installers and then fail at signing."
            exit 1
          fi
          # No flags: the key and password come from the environment, which is
          # exactly how tauri-action invokes the signer at the end of the build.
          # A preflight that takes a different path can pass while the real
          # thing fails, which would make it worse than no preflight — and the
          # first attempt at this step did precisely that in reverse: it passed
          # `-f <keyfile>` *while* TAURI_SIGNING_PRIVATE_KEY was set, and the
          # CLI refused ("--private-key-path cannot be used with
          # --private-key"). It failed the build for a reason that had nothing
          # to do with the key.
          echo preflight > "$RUNNER_TEMP/tn_probe.txt"
          if ! npx tauri signer sign "$RUNNER_TEMP/tn_probe.txt" > "$RUNNER_TEMP/tn_probe.log" 2>&1; then
            echo "::error::Cannot sign with the configured updater key. The build would have failed after ~12 minutes of compiling."
            # The message names the cause: wrong password vs unreadable key are
            # different problems with different fixes.
            sed -e 's/^/    /' "$RUNNER_TEMP/tn_probe.log" | head -5
            echo ""
            echo "If this says 'Wrong password for that key': the secret does not match the key."
            echo "A trailing newline is the usual reason — set it with printf, which adds none:"
            echo "    printf %s 'your passphrase' | gh secret set TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            rm -f "$RUNNER_TEMP/tn_probe.txt" "$RUNNER_TEMP/tn_probe.txt.sig"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/tn_probe.txt" "$RUNNER_TEMP/tn_probe.txt.sig"
          echo "Updater key and password verified — the signing step at the end will work."

      # The same gates CI runs, once per platform: a release should not be the
      # first time these are checked on this OS.
      - name: Check
        working-directory: apps/desktop
        run: |
          npm run lint
          npm run typecheck
          npm test

      # Compile everything now, before any signing secret is in the
      # environment. (Audit TN-011.)
      #
      # The updater key used to be in the environment of the whole build: the
      # frontend toolchain (vite and every plugin it loads) and the build
      # script of every Rust dependency ran with it, and any one of them could
      # have read it. A release is signed by whoever holds that key.
      #
      # So the build is two passes. This one runs the frontend build and
      # compiles every crate, with no bundle and no secrets. The pass below
      # has the keys, skips the frontend build (tauri.bundle-only.conf.json
      # empties `beforeBuildCommand`) and finds every dependency already
      # compiled, so what runs with the keys is the Tauri bundler and signer.
      # Checked by hand on macOS: the second pass ran no vite and recompiled
      # only this repository's own app crate, whose embedded config changed.
      #
      # What it does not stop: a dependency whose build script names the key
      # in `cargo:rerun-if-env-changed` would be re-run in the second pass.
      # None does today; `cargo deny` and the lockfile are what guard that.
      #
      # Must stay above the Apple steps: they put the certificate into
      # `$GITHUB_ENV`, which every later step inherits.
      - name: Compile — no signing secrets in the environment
        working-directory: apps/desktop
        run: npx tauri build --no-bundle --target ${{ matrix.target }}

      # Apple signing is opt-in, and it has to be opt-in by the variable being
      # ABSENT — not empty.
      #
      # Tauri's bundler enables macOS codesigning when APPLE_CERTIFICATE is
      # *defined*: `std::env::var` returns Ok("") for a variable that is set to
      # the empty string, so an `env:` block listing a secret that does not
      # exist still turns signing on, with an empty certificate. Every macOS
      # bundle then died at:
      #
      #   failed to bundle project: failed codesign application:
      #   failed to run command security import: failed to import keychain certificate
      #
      # That is what killed the first v0.1.0-beta.1 build, on the leg that had
      # nothing to do with signing. The comment that used to sit here claimed
      # the opposite — "absent, the mac builds are ad-hoc signed" — which was
      # never true and had never been run.
      #
      # `$GITHUB_ENV` is the only way to set a variable conditionally: an `env:`
      # key always exists. HAS_APPLE_CERT is computed at job level because the
      # `secrets` context is not available in a step-level `if:`.
      # The certificate goes into a keychain made here, and Tauri is given only
      # its name (APPLE_SIGNING_IDENTITY). Handing Tauri APPLE_CERTIFICATE
      # instead makes it import the .p12 itself and then look the identity up
      # by Apple's name prefixes ("Developer ID Application:", "Apple
      # Development:" …), so the self-signed certificate from
      # scripts/make-macos-cert.sh is never found: "failed to resolve signing
      # identity" (dev builds 45909287798 and 45911996838). With only the name
      # set, Tauri runs `codesign -s <name>` against the keychain search list,
      # which works for a Developer ID and a self-signed certificate alike.
      #
      # The certificate is also trusted for code signing on this throwaway
      # runner, which an untrusted self-signed identity needs to count as
      # valid; a Developer ID is already trusted, so that is a no-op for one.
      - name: Apple signing — only when a certificate actually exists
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        # Secrets arrive as environment variables, never interpolated into the
        # script text: `${{ secrets.X }}` inside `run:` is pasted into the
        # shell source before it runs, the expression-injection pattern.
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          p12="$RUNNER_TEMP/signing.p12"
          cer="$RUNNER_TEMP/signing.cer"
          kp="$(openssl rand -hex 24)"
          printf %s "$S_APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$p12" -k "$kc" -f pkcs12 -P "$S_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          # shellcheck disable=SC2046 # the existing list, one path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$S_APPLE_SIGNING_IDENTITY" -p "$kc" > "$cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$cer"
          rm -f "$p12" "$cer"
          security find-identity -v -p codesigning "$kc"
          echo "APPLE_SIGNING_IDENTITY=$S_APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "macOS bundles will be signed as $S_APPLE_SIGNING_IDENTITY."

      # Notarization is a second, independent thing: it needs an Apple ID as
      # well as a certificate, and asking for it without one hangs or errors
      # rather than skipping.
      - name: Apple notarization — only when the Apple ID exists too
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_ID == 'true'
        env:
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_ID=$S_APPLE_ID"
            echo "APPLE_PASSWORD=$S_APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$S_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Apple ID present — bundles will be notarized and stapled."

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `bundle.createUpdaterArtifacts` is on, so every bundle is signed for
          # the updater. Without this secret the build fails at the signing step
          # *after* producing the installers — which looks like it worked.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_* deliberately absent here — see the two steps above. Without
          # an Apple Developer account the macOS bundles are not Developer ID
          # signed or notarized, and Gatekeeper warns on first launch. A
          # self-signed certificate (scripts/make-macos-cert.sh) still gives
          # every build one identity, so the keychain stops asking after updates.
        with:
          projectPath: apps/desktop
          # Bundle and sign only: see the compile step above.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle-only.conf.json
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: TupleNest ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}
          releaseBody: |
            See the assets below, and CHANGELOG.md for what changed. Every
            platform is built in CI from the tagged commit.

            The macOS builds are not notarized unless an Apple Developer
            certificate is configured, so the first launch needs Gatekeeper
            approval — the README explains how.
          # The updater reads
          # github.com/talaatmagdyx/TupleNest/releases/latest/download/latest.json,
          # which this generates from the per-platform .sig files. Without it
          # the endpoint 404s and no installed copy ever sees an update.
          uploadUpdaterJson: true
          # Draft on purpose — nothing ships until it is published by hand.
          # Worth knowing: a draft is not "latest", so the updater URL stays a
          # 404 until you hit Publish. That is the intended sequence, not a
          # bug: the release goes public and existing copies see it at the same
          # moment.
          releaseDraft: true
          # A manual dispatch build is not a release. Left as `false`, publishing
          # a `v47-dev` draft by hand would make it "latest" and the updater
          # would ship a scratch build to every install.
          # A tag containing a hyphen (v0.1.0-beta.1) is a prerelease channel
          # and must be labeled as one: GitHub does not treat a prerelease as
          # `latest`, so beta installs never become the updater target for
          # people on stable — and betas can be published without committing
          # every existing install to them.
          #
          # Deliberate: the beta lives in the TAG, not in tauri.conf's version,
          # which stays numeric (0.1.0). WiX rejects semver prerelease suffixes
          # in MSI versions, so `0.1.0-beta.1` as the app version would kill
          # the Windows leg at bundling.
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}

  # Checksums and an SBOM, attached to the same release.
  #
  # These matter more here than they would elsewhere: the Windows installer is
  # unsigned and the macOS builds are not notarized, so a published SHA-256 is
  # the *only* integrity signal a downloader has. Nothing verified the bytes.
  provenance:
    name: checksums, SBOM and attestation
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For actions/attest-build-provenance: signs a statement that these
      # artifacts came out of this workflow, from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The release is a draft, so `gh release download` needs the tag.
          gh release download "$TAG" --dir dist --pattern '*' || true
          ls -la dist

      - name: SHA-256SUMS
        run: |
          set -euo pipefail
          cd dist
          # latest.json is generated from the .sig files and changes if anyone
          # re-uploads; checksumming the installers is the point.
          rm -f SHA256SUMS latest.json
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      # A dev build is a draft, and a draft cannot be read by the Smoke
      # workflow's read-only token. So that a dev build can still be installed
      # and run on real Linux, Windows and Intel Mac machines before anything
      # is published, the installers Smoke needs are also kept for one day as
      # a workflow artifact. Only for a dev build: a tagged release is
      # published, and Smoke reads that directly.
      #
      # On a public repository anyone signed in to GitHub can download a
      # run's artifacts while they exist. These are the same files the draft
      # holds, for a day.
      - name: Stage the installers for the Smoke workflow (dev builds only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-inputs
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/TupleNest_*_amd64.deb
            dist/TupleNest_*_x64_en-US.msi
            dist/TupleNest_*_x64.app.tar.gz
            dist/SHA256SUMS

      # `set -euo pipefail` was here doing nothing: every line that could fail
      # ended in `|| true`, so a broken cargo-cyclonedx produced no SBOM, no
      # error, and a green job — while the README told people a release ships
      # one. An SBOM that silently might not exist is not a supply-chain
      # control, it is a claim. Only the install keeps its `|| true`, because
      # the binary may already be cached; the generate and the copy must work.
      - name: SBOM
        run: |
          set -euo pipefail
          # Pinned: this job holds contents:write and id-token:write, so an
          # unpinned install would run whatever was published most recently.
          # 0.5.10 is what produced the 0.1.1-beta.12 SBOMs.
          cargo install --locked cargo-cyclonedx --version 0.5.10 || true
          command -v cargo-cyclonedx >/dev/null || { echo "cargo-cyclonedx did not install"; exit 1; }
          # One .cdx.json per crate, written next to each Cargo.toml.
          cargo cyclonedx --format json --all
          # Depth 4, not 3: the application crate is apps/desktop/src-tauri,
          # one level deeper than crates/*. At 3 its SBOM — the one that lists
          # Tauri, the WebView bindings and the updater — was left out.
          find . -maxdepth 4 -name '*.cdx.json' -not -path './dist/*' -exec cp {} dist/ \;
          cd apps/desktop && npm ci --ignore-scripts && npm sbom --sbom-format cyclonedx > ../../dist/frontend-sbom.cdx.json
          cd ../..
          # Prove it rather than hope: one per workspace crate, plus the frontend.
          count=$(ls dist/*.cdx.json | wc -l)
          echo "SBOMs collected: $count"; ls -1 dist/*.cdx.json
          members=$(cargo metadata --no-deps --format-version 1 | jq '.workspace_members | length')
          [ "$count" -eq $((members + 1)) ] || {
            echo "expected $members Rust SBOMs (one per workspace crate) plus the frontend's, found $count"
            exit 1
          }
          ls dist/ | grep -q '^tuplenest-desktop.*\.cdx\.json$' || { echo "the application crate's SBOM is missing"; exit 1; }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
        run: gh release upload "$TAG" dist/SHA256SUMS dist/*.cdx.json --clobber
