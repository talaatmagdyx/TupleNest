[package]
name = "tuplenest-desktop"
description = "TupleNest desktop application (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Rust-side only: `copy_result_text` puts the text on the clipboard itself, so
# it never crosses the IPC bridge. No JS package, no capability permission.
# arboard directly, without its image support: the Tauri clipboard plugin
# turns that on and brings the `image` and `tiff` crates with it.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tuplenest-workspace-store = { path = "../../../crates/workspace-store" }
tuplenest-telemetry = { path = "../../../crates/telemetry" }
tuplenest-credential-store = { path = "../../../crates/credential-store" }
tuplenest-driver-api = { path = "../../../crates/driver-api" }
tuplenest-driver-postgres = { path = "../../../crates/driver-postgres" }
tuplenest-connection-core = { path = "../../../crates/connection-core" }
tuplenest-metadata-cache = { path = "../../../crates/metadata-cache" }
tuplenest-result-stream = { path = "../../../crates/result-stream" }
tuplenest-ssh-core = { path = "../../../crates/ssh-core" }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
# Text sorting by the Unicode Collation Algorithm, as the WebView's
# localeCompare does. Shares its data crates with icu_normalizer (via url).
icu_collator = "2"
tauri-plugin-opener = "2.5.4"
