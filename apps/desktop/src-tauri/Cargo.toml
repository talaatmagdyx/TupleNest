[package]
name = "tuplenest-desktop"
description = "TupleNest desktop application (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# Rust-side only: `copy_result_text` puts the text on the clipboard itself, so
# it never crosses the IPC bridge. No JS package, no capability permission.
# arboard directly, without its image support: the Tauri clipboard plugin
# turns that on and brings the `image` and `tiff` crates with it.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tuplenest-workspace-store = { path = "../../../crates/workspace-store" }
tuplenest-telemetry = { path = "../../../crates/telemetry" }
tuplenest-credential-store = { path = "../../../crates/credential-store" }
tuplenest-driver-api = { path = "../../../crates/driver-api" }
tuplenest-driver-postgres = { path = "../../../crates/driver-postgres" }
tuplenest-driver-sqlite = { path = "../../../crates/driver-sqlite" }
tuplenest-connection-core = { path = "../../../crates/connection-core" }
tuplenest-metadata-cache = { path = "../../../crates/metadata-cache" }
tuplenest-result-stream = { path = "../../../crates/result-stream" }
tuplenest-ssh-core = { path = "../../../crates/ssh-core" }
tracing = { workspace = true }
# io-util/io-std: the MCP server (`tuplenest-desktop mcp`) speaks over stdio.
tokio = { workspace = true, features = ["io-util", "io-std"] }
# The platform data directory, for the MCP server, which has no Tauri app to
# ask for `app_data_dir`. Already in the tree through Tauri.
dirs = "7"
async-trait = { workspace = true }
uuid = { workspace = true }
# Text sorting by the Unicode Collation Algorithm, as the WebView's
# localeCompare does. Shares its data crates with icu_normalizer (via url).
icu_collator = "2"
tauri-plugin-opener = "2.5.4"
# The assistant's HTTP client (Anthropic API, Ollama). Both were already in
# the tree for the updater, with these features and the same ring provider,
# so naming them here adds no crate to the build. The WebView never makes a
# network request itself; every assistant call goes out from Rust.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# MemoryStore: the MCP and assistant tests must never touch the real keychain.
tuplenest-credential-store = { path = "../../../crates/credential-store", features = ["test-support"] }
# To make the audit write fail on purpose (a trigger on audit_log).
rusqlite = { workspace = true }
tempfile = "3"
# A loopback mock HTTP server for the assistant's provider tests: no real network.
tokio = { workspace = true, features = ["net", "io-util"] }
